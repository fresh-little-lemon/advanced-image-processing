name: Python reference tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          OPENBLAS_NUM_THREADS: '1'
